name: Deploy to WordPress.org

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout UI library
        run: git clone --depth 1 https://x-access-token:${{ secrets.UI_REPO_TOKEN }}@github.com/digital-license-manager/ui.git ../../libraries/dlm-ui

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI library dependencies
        run: |
          cd ../../libraries/dlm-ui
          bun install --frozen-lockfile

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate version consistency
        id: validate_version
        run: |
          TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"

          # Strip pre-release suffix (-test, -alpha, -beta, -rc) and optional version (.N or N) for comparison
          BASE_VERSION=$(echo "$TAG_VERSION" | sed -E 's/-(test|alpha|beta|rc)[.0-9]*$//')

          # Extract version from PHP header
          PHP_HEADER_VERSION=$(grep -Po "Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+" digital-license-manager.php | head -1)

          # Extract version from DLM_PLUGIN_VERSION constant
          PHP_CONSTANT_VERSION=$(grep -Po "DLM_PLUGIN_VERSION',\s*'\K[0-9]+\.[0-9]+\.[0-9]+" digital-license-manager.php)

          # Extract version from readme.txt
          README_VERSION=$(grep -Po "Stable tag:\s*\K[0-9]+\.[0-9]+\.[0-9]+" readme.txt)

          # Extract version from composer.json (must match tag exactly, including any pre-release suffix)
          COMPOSER_VERSION=$(jq -r '.version // empty' composer.json)

          echo "Tag version: $TAG_VERSION"
          echo "Base version (for comparison): $BASE_VERSION"
          echo "PHP header version: $PHP_HEADER_VERSION"
          echo "PHP constant version: $PHP_CONSTANT_VERSION"
          echo "Readme version: $README_VERSION"
          echo "composer.json version: $COMPOSER_VERSION"

          # Check if this is a pre-release and output for later steps
          if [ "$TAG_VERSION" != "$BASE_VERSION" ]; then
            echo "ℹ️ Pre-release detected, validating base version"
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          # Validate all versions match
          if [ "$BASE_VERSION" != "$PHP_HEADER_VERSION" ]; then
            echo "::error::Version mismatch: Tag ($BASE_VERSION) != PHP header ($PHP_HEADER_VERSION)"
            exit 1
          fi

          if [ "$BASE_VERSION" != "$PHP_CONSTANT_VERSION" ]; then
            echo "::error::Version mismatch: Tag ($BASE_VERSION) != DLM_PLUGIN_VERSION ($PHP_CONSTANT_VERSION)"
            exit 1
          fi

          if [ "$BASE_VERSION" != "$README_VERSION" ]; then
            echo "::error::Version mismatch: Tag ($BASE_VERSION) != readme.txt ($README_VERSION)"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$COMPOSER_VERSION" ]; then
            echo "::error::Version mismatch: Tag ($TAG_VERSION) != composer.json ($COMPOSER_VERSION)"
            exit 1
          fi

          echo "✅ All versions match: $BASE_VERSION (composer: $COMPOSER_VERSION)"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Clean up TCPDF fonts
        run: bash scripts/clean_up.sh

      - name: Build Gutenberg blocks
        run: |
          cd blocks
          bun install --frozen-lockfile
          bun run build

      - name: Build admin UI
        run: |
          bun install
          bun run build

      - name: Create distribution directory
        run: |
          mkdir -p dist/digital-license-manager
          rsync -av --exclude-from='.distignore' ./ dist/digital-license-manager/

      - name: Create ZIP artifact
        run: |
          cd dist
          zip -r digital-license-manager-${{ steps.get_version.outputs.VERSION }}.zip digital-license-manager

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: digital-license-manager-${{ steps.get_version.outputs.VERSION }}
          path: dist/digital-license-manager-${{ steps.get_version.outputs.VERSION }}.zip

      - name: Determine SVN deployment mode
        id: check-svn
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          # Deployment modes:
          #   none         — no SVN deployment (skipped prereleases or missing creds)
          #   rc-tag-only  — create tags/$VERSION/ on WP.org SVN but DO NOT touch trunk
          #                  (keeps current Stable tag intact so RC doesn't trigger
          #                  auto-updates; users can download via Previous Versions)
          #   full         — standard 10up deploy: rsync to trunk + create tag
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "Skipping WordPress.org deployment: SVN credentials not set"
            echo "mode=none" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" =~ -(test|alpha|beta) ]]; then
            echo "Skipping WordPress.org deployment for pre-release: ${{ github.ref_name }}"
            echo "mode=none" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" =~ -rc ]]; then
            echo "RC tag: will create SVN tag only (trunk untouched)"
            echo "mode=rc-tag-only" >> $GITHUB_OUTPUT
          else
            echo "Stable tag: full WordPress.org deployment"
            echo "mode=full" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to WordPress.org (full)
        if: steps.check-svn.outputs.mode == 'full'
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: digital-license-manager
          BUILD_DIR: dist/digital-license-manager

      - name: Deploy RC tag to WordPress.org (SVN tag only, trunk untouched)
        if: steps.check-svn.outputs.mode == 'rc-tag-only'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          SLUG: digital-license-manager
        run: |
          set -eo pipefail
          SVN_DIR="$HOME/svn-$SLUG"

          if ! command -v svn >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y subversion
          fi

          echo "➤ Checking out SVN (tags dir only)..."
          svn checkout --depth immediates "https://plugins.svn.wordpress.org/$SLUG/" "$SVN_DIR"
          svn update --set-depth immediates "$SVN_DIR/tags"

          if [ -d "$SVN_DIR/tags/$VERSION" ]; then
            echo "ℹ︎ tags/$VERSION already exists on WP.org SVN — nothing to do."
            exit 0
          fi

          echo "➤ Creating tags/$VERSION from dist/..."
          mkdir -p "$SVN_DIR/tags/$VERSION"
          rsync -rc "$GITHUB_WORKSPACE/dist/$SLUG/" "$SVN_DIR/tags/$VERSION/"

          # Keep the tagged dir's readme.txt self-consistent — tagged version
          # readme should advertise itself, not an older internal beta tag.
          # (This does NOT affect what WP.org serves; only trunk's Stable tag
          # pointer drives downloads/updates, and trunk is untouched here.)
          if [ -f "$SVN_DIR/tags/$VERSION/readme.txt" ]; then
            sed -i "s/^Stable tag:.*/Stable tag: $VERSION/" "$SVN_DIR/tags/$VERSION/readme.txt"
          fi

          cd "$SVN_DIR"
          svn add "tags/$VERSION"

          echo "➤ Committing SVN tag only (trunk unchanged)..."
          svn commit -m "Tag $VERSION (pre-release; trunk untouched)" \
            --no-auth-cache --non-interactive \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD"

          echo "✓ RC tag $VERSION published. Available via:"
          echo "  - Plugin page → Advanced View → Previous Versions"
          echo "  - https://downloads.wordpress.org/plugin/$SLUG.$VERSION.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/digital-license-manager-${{ steps.get_version.outputs.VERSION }}.zip
          generate_release_notes: true
          prerelease: ${{ steps.validate_version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
